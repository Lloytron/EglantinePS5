# Quick check for the Lichii update: applies the core patch and runs the port's source
# rewriting in --report mode, which names every anchor that no longer matches (a few minutes,
# instead of finding them one at a time in the full build).
name: Check port anchors
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - name: Install glslang
        run: sudo apt-get install -y --no-install-recommends glslang-tools
      - name: Apply the core patch
        run: bash tools/apply-eglantine-patches.sh
      - name: Run prepare-vulkan-port.py --report
        run: |
          mkdir -p "$RUNNER_TEMP/port-out"
          python3 -I tools/prepare-vulkan-port.py --report Eglantine "$RUNNER_TEMP/port-out"
